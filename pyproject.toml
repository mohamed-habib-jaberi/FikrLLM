[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fikrllm"
version = "0.1.0"
description = "A bilingual (Arabic + English) GPT, built from scratch"

requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.26",
    "tokenizers>=0.15",
    "pandas>=2.0",
    "pyarrow>=25.0.1",
    "tqdm>=4.66",
    "datasets>=5.0.1",
    "huggingface-hub>=1.27.0",
    "trackio>=0.34.0",
    "requests>=2.31",
    "mwparserfromhell>=0.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["fikrllm*"]

[tool.setuptools.package-data]
fikrllm = ["assets/tokenizer.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/ch03-build-tokenizer/03_pack_corpus.py" = ["E402"]
